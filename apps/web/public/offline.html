<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão · PapoPro</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a0f1c;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #367bec;
        color: #fff;
        font-size: 30px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: #94a3b8;
      }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        border: 0;
        border-radius: 8px;
        background: #367bec;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">P</div>
      <h1>Você está sem conexão</h1>
      <p>
        O PapoPro precisa de internet para carregar seus leads, conversas e cadências. Verifique
        sua rede e tente de novo.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>

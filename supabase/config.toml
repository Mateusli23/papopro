# Supabase local stack — gerado pra dev local (M7+, fallback do bug Tenant/user not found
# que veio de antivírus interceptando TLS no Windows). Cloud cont. em iffmjydjeukozopxxitb
# pra prod; este toml é só pra `supabase start` (Docker).
project_id = "papopro-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
# Email local — desvia emails do Supabase Auth (signup confirmation) pra UI local.
# Acessa em http://127.0.0.1:54324 — sem precisar de Resend nem caixa real.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
# Em dev local NÃO exigir confirmação — vai direto pro fluxo de onboarding.
# Pra simular fluxo real depois (verify-email + callback PKCE), flipar pra true
# e usar o inbucket em http://127.0.0.1:54324 pra clicar no link.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
# Desabilitado em dev local pq o Deno bootstrap tenta baixar `deno.land/std`
# e o antivírus da máquina intercepta TLS, fazendo o Deno rejeitar com
# UnknownIssuer. PapoPro não usa edge functions ainda (chega em M11), então
# zero impacto pra dev hoje.
enabled = false
policy = "oneshot"
inspector_port = 8083

name: Cleanup orphan attachments

# M8#6 — Dispara o endpoint `/api/cron/cleanup-attachments` diariamente às
# 03:00 BRT (06:00 UTC). O endpoint apaga storage objects + rows de anexos
# com `deletedAt < NOW() - 30 days`.
#
# Por que GitHub Action em vez de pg_cron + pg_net + Edge Function: Edge
# Functions estão bloqueadas em dev local nessa máquina (memória
# `dev-local-windows-antivirus-tls`). GitHub Action é portável, testável
# manualmente via `workflow_dispatch` e independente do estado da Vercel.
#
# **Secrets necessários** (Repo Settings → Secrets and variables → Actions):
#  - `CRON_SECRET` — mesma string em `apps/web/.env` (Vercel) e aqui
#  - `APP_HOST` — `app.pipeflow.com.br` em produção; ajustável em staging

on:
  schedule:
    # Diariamente às 06:00 UTC (= 03:00 BRT, baixo tráfego).
    - cron: '0 6 * * *'
  # Permite trigger manual via UI do GitHub pra debug.
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger cleanup endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_HOST" ]; then
            echo "::error::CRON_SECRET ou APP_HOST não configurado nos secrets."
            exit 1
          fi

          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "https://$APP_HOST/api/cron/cleanup-attachments")

          status="${response##*$'\n'}"
          body="${response%$'\n'*}"

          echo "HTTP $status"
          echo "Response: $body"

          if [ "$status" != "200" ]; then
            echo "::error::Cleanup endpoint retornou $status"
            exit 1
          fi

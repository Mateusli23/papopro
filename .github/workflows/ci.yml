name: CI

on:
  push:
    # `dev` é a integration trunk (gitflow strict — ver CLAUDE.md §10).
    # Todo push de feature passa por ela antes de promover pra `main`
    # (release). `main` continua disparando o CI pra cobrir release direto
    # ou hotfix.
    branches: [main, dev]
  pull_request:
    # PRs miram `dev` por default; `main` só recebe PRs de release
    # (`dev → main`). Listar ambos garante gate em qualquer fluxo.
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prisma generate` precisa rodar explicitamente. Em pnpm 9.15+ o
      # postinstall do @prisma/client é pulado quando não está em
      # `pnpm.onlyBuiltDependencies` — sem o client gerado, `tsc --noEmit`
      # em packages/db quebra com `Module '@prisma/client' has no exported
      # member 'PrismaClient'`. CI não pode confiar em postinstall implícito.
      - name: Generate Prisma Client
        run: pnpm --filter @papopro/db db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
